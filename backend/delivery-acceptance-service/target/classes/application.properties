spring.application.name=delivery-acceptance-service
server.port=${PORT:8095}

# Eureka
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=https://food-delievery-app-eureka-server.vercel.app/eureka/
eureka.instance.hostname=${DELIVERY_ACCEPTANCE_SERVICE_HOST:food-delievery-app-delivery-acceptance-service.onrender.com}
eureka.instance.secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false

# MongoDB — driver DB (shared with delivery-service and delivery-matching-service)
spring.data.mongodb.uri=mongodb+srv://${MONGODB_USERNAME:mdaazam0786}:${MONGODB_PASSWORD:aazam%40786}@${MONGODB_HOST:cluster0.sczcxrl.mongodb.net}/foodzie?retryWrites=true&w=majority

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4200}

# Kafka - uses environment variables for production Aiven configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM}
spring.kafka.sasl.jaas-config=${KAFKA_SASL_JAAS_CONFIG}
# Force use of bootstrap servers, don't use broker advertised addresses
spring.kafka.properties.client.dns.lookup=use_all_dns_ips
spring.kafka.properties.reconnect.backoff.ms=50
spring.kafka.properties.reconnect.backoff.max.ms=1000
spring.kafka.consumer.group-id=delivery-acceptance-service
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka topics
app.kafka.topics.delivery-events=delivery-events
app.kafka.topics.order-events=order-events

# Kafka Auto-create Topics
spring.kafka.admin.properties.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.admin.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.admin.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM}
spring.kafka.admin.properties.sasl.jaas-config=${KAFKA_SASL_JAAS_CONFIG}
