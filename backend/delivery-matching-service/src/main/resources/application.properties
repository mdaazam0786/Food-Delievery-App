spring.application.name=delivery-matching-service
server.port=8092

# Eureka
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
eureka.instance.hostname=${DELIVERY_MATCHING_SERVICE_HOST}
eureka.instance.secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false

# ── MongoDB — reads driver profiles from MongoDB collection ──
# MUST be provided via environment variable, no default
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/foodzie}

# MongoDB Connection Pool Configuration — critical for performance under load
spring.data.mongodb.max-pool-size=50
spring.data.mongodb.min-pool-size=10
spring.data.mongodb.socket-connect-timeout-ms=5000
spring.data.mongodb.socket-timeout-ms=10000
spring.data.mongodb.server-selection-timeout-ms=5000
spring.data.mongodb.wait-queue-timeout-ms=120000

# ── Redis ─────────────────────────────────────────────────────────────────────
# Redis connection URL for geospatial data and driver heartbeats
# MUST be provided via environment variable, no default
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Redis connection pool configuration (for Apache Commons Pool via Lettuce)
spring.redis.lettuce.pool.min-idle=5
spring.redis.lettuce.pool.max-idle=20
spring.redis.lettuce.pool.max-active=50
spring.redis.lettuce.pool.max-wait=-1ms
spring.redis.lettuce.shutdown-timeout=2000ms

# ── JWT ───────────────────────────────────────────────────────────────────────
# MUST be provided via environment variable, no default - DO NOT hardcode secrets!
app.jwt.secret=ZmVlZGllLXVzZXItc2VydmljZS1zZWNyZXQta2V5LTI1Ni1iaXRzLWxvbmch

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4200}

# ── Kafka ─────────────────────────────────────────────────────────────────────
# Use kafka:9092 for docker-compose, localhost:9092 for standalone containers
# Override with KAFKA_BOOTSTRAP_SERVERS env var for production
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.security.protocol=PLAINTEXT
# Force use of bootstrap servers, don't use broker advertised addresses
spring.kafka.properties.client.dns.lookup=use_all_dns_ips
spring.kafka.properties.reconnect.backoff.ms=50
spring.kafka.properties.reconnect.backoff.max.ms=1000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=delivery-matching-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.foodzie.delivery_matching_service.event

app.kafka.topics.order-events=order-events
app.kafka.topics.delivery-events=delivery-events

# Kafka Auto-create Topics
spring.kafka.admin.properties.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# ── Matching algorithm config ─────────────────────────────────────────────────
# Initial search radius in km
app.matching.initial-radius-km=3.0
# Expansion steps when no drivers found (km)
app.matching.radius-steps=3.0,5.0,8.0,10.0
# Maximum candidates to select
app.matching.max-candidates=5
# Heartbeat key prefix — must match delivery-service and location-update-service
app.matching.heartbeat-key-prefix=driver:heartbeat:
# Geo set key prefix — must match delivery-service
app.matching.geo-key-prefix=drivers:active:

logging.level.com.foodzie=DEBUG
logging.level.org.springframework.security=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Graceful shutdown configuration
spring.lifecycle.timeout-per-shutdown-phase=30s
