spring.application.name=delivery-matching-service
server.port=8092

# ── Eureka (local) ─────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.hostname=delivery-matching-service
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${EUREKA_INSTANCE_HOSTNAME:delivery-matching-service}:${server.port}

# ── MongoDB ────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/foodzie}

# ── Redis ──────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://redis:6379}

# ── JWT ────────────────────────────────────────────────────────
app.jwt.secret=ZmVlZGllLXVzZXItc2VydmljZS1zZWNyZXQta2V5LTI1Ni1iaXRzLWxvbmch

app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:4200

# ── Kafka (local docker) ───────────────────────────────────────
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.security.protocol=PLAINTEXT
spring.kafka.properties.client.dns.lookup=use_all_dns_ips
spring.kafka.properties.reconnect.backoff.ms=50
spring.kafka.properties.reconnect.backoff.max.ms=1000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=delivery-matching-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

app.kafka.topics.order-events=order-events
app.kafka.topics.delivery-events=delivery-events

# ── Matching algorithm config ─────────────────────────────────
app.matching.initial-radius-km=3.0
app.matching.radius-steps=3.0,5.0,8.0,10.0
app.matching.max-candidates=5
app.matching.heartbeat-key-prefix=driver:heartbeat:
app.matching.geo-key-prefix=drivers:active:

logging.level.com.foodzie=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.apache.kafka=WARN

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
